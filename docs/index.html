<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LIX Flood Risk Fusion</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0; }
    #map { position: absolute; inset: 0; }
    .topbar { position: absolute; z-index: 1000; top: 12px; left: 54px; right: 12px; background: rgba(15,23,42,.94); border: 1px solid #334155; border-radius: 12px; padding: 12px 14px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
    .title { font-weight: 900; font-size: 21px; margin: 0; }
    .subtitle { margin-top: 4px; color: #f8fafc; font-size: 17px; font-weight: 800; }
    .panel { position: absolute; z-index: 1000; top: 108px; right: 12px; width: 390px; background: rgba(15,23,42,.94); border: 1px solid #334155; border-radius: 12px; padding: 13px; box-shadow: 0 6px 20px rgba(0,0,0,.25); font-size: 15px; line-height: 1.35; }
    .panel h2 { margin: 0 0 9px 0; font-size: 18px; }
    .row { display: flex; align-items: center; gap: 9px; margin: 7px 0; font-size: 15px; }
    .control-row { display: flex; align-items: center; gap: 8px; margin: 10px 0; font-size: 15px; }
    .control-row input[type="range"] { flex: 1; }
    .period-buttons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 8px 0 10px 0; }
    .period-btn { cursor: pointer; border: 1px solid #475569; border-radius: 10px; background: rgba(30,41,59,.88); color: #e2e8f0; padding: 10px 10px; text-align: left; }
    .period-btn.active { border-color: #38bdf8; background: rgba(14,116,144,.78); }
    .period-btn b { display:block; font-size:15px; line-height:1.15; }
    .period-btn span { display:block; color:#e2e8f0; font-size:14px; margin-top:3px; }
    .swatch { width: 17px; height: 17px; border-radius: 4px; border: 1px solid rgba(255,255,255,.6); display: inline-block; flex: 0 0 auto; }
    .small { color: #cbd5e1; font-size: 14px; }
    .warn { color: #fcd34d; font-weight: 800; }
    .badge { display:inline-block; padding: 4px 8px; border-radius: 999px; font-weight: 900; font-size: 13px; margin-bottom: 6px; }
    .badge.good { background: #064e3b; color: #bbf7d0; border: 1px solid #22c55e; }
    .badge.warn { background: #713f12; color: #fef3c7; border: 1px solid #f59e0b; }
    .sourcebox { background: rgba(30,41,59,.75); border: 1px solid #475569; border-radius: 9px; padding: 8px; margin: 8px 0; }
    .leaflet-popup-content { font-size: 13px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="topbar">
    <div class="title">LIX Flood Risk Fusion</div>
    <div id="topPeriodLabel" class="subtitle">Loading forecast period...</div>
  </div>
  <div class="panel">
    <h2>Forecast period</h2>
    <div id="periodButtons" class="period-buttons"><div class="small">Loading periods...</div></div>

    <hr style="border-color:#334155">
    <div id="sourceMode" class="sourcebox small">Checking data source...</div>
    <div class="row"><span class="swatch" style="background:#dc2626"></span> Significant</div>
    <div class="row"><span class="swatch" style="background:#f97316"></span> Probable</div>
    <div class="row"><span class="swatch" style="background:#facc15"></span> Possible</div>
    <div class="row"><span class="swatch" style="background:#22c55e"></span> HREF QPF</div>
    <div class="row"><span class="swatch" style="background:#38bdf8"></span> 6-hr FFG overlay</div>
    <div class="row"><span class="swatch" style="background:#a78bfa"></span> Flood-prone overlay</div>

    <hr style="border-color:#334155">
    <div class="control-row">
      <label><input id="hrefRasterToggle" type="checkbox" checked> Show HREF QPF</label>
    </div>
    <div class="control-row">
      <label><input id="ffgLayerToggle" type="checkbox"> Show 6-hr FFG</label>
    </div>
    <div class="control-row">
      <label><input id="proneLayerToggle" type="checkbox"> Show flood-prone areas</label>
    </div>
    <div class="control-row small">
      <span>QPF opacity</span>
      <input id="hrefOpacity" type="range" min="0" max="1" step="0.05" value="0.58">
      <span id="hrefOpacityValue">58%</span>
    </div>
    <div id="status" class="small"></div>
  </div>

<script>
var map = L.map('map', { preferCanvas: true }).setView([30.1, -90.25], 8);
var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
var hrefRasterLayer = null;
var currentManifest = null;
var periodsManifest = null;
var ffgData = null;
var proneData = null;
var activePeriodIndex = 1;
var localTimeZone = 'America/Chicago';

function fmtIn(value) { return value == null || value === '' ? '' : Number(value).toFixed(2).replace(/\.00$/, '') + ' in'; }
function featureCount(fc) { return fc && fc.features ? fc.features.length : 0; }
function getJSON(url) { return fetch(url, { cache: 'no-store' }).then(function(r){ if(!r.ok) throw new Error(url + ': HTTP ' + r.status); return r.json(); }); }
function pad2(n) { return String(n).padStart(2, '0'); }

function parseRunDate(runLabel) {
  var m = String(runLabel || '').match(/^(\d{4})(\d{2})(\d{2})\s+(\d{2})Z/);
  if (!m) return null;
  return new Date(Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3]), Number(m[4]), 0, 0));
}

function localParts(date) {
  var parts = new Intl.DateTimeFormat('en-US', {
    timeZone: localTimeZone,
    weekday: 'short', month: 'short', day: 'numeric',
    hour: 'numeric', minute: '2-digit', hour12: true, timeZoneName: 'short'
  }).formatToParts(date);
  var out = {};
  parts.forEach(function(p){ out[p.type] = p.value; });
  return out;
}

function cleanHour(parts) {
  var h = parts.hour + (parts.minute === '00' ? '' : ':' + parts.minute) + ' ' + parts.dayPeriod;
  return h.replace(' AM', 'am').replace(' PM', 'pm');
}

function periodLabel(period) {
  var duration = Number((periodsManifest && periodsManifest.duration_hr) || 6);
  var runDate = parseRunDate(period.href_run);
  var fh = Number(period.forecast_hour);
  if (!runDate || !Number.isFinite(fh)) return { dateLine: 'Forecast period', timeLine: period.href_period || '', topLine: period.href_period || '' };
  var start = new Date(runDate.getTime() + (fh - duration) * 3600 * 1000);
  var end = new Date(runDate.getTime() + fh * 3600 * 1000);
  var sp = localParts(start);
  var ep = localParts(end);
  var startDate = sp.weekday + ', ' + sp.month + ' ' + sp.day;
  var endDate = ep.weekday + ', ' + ep.month + ' ' + ep.day;
  var sameDate = startDate === endDate;
  var dateLine = sameDate ? startDate : startDate + ' → ' + endDate;
  var timeLine = cleanHour(sp) + '–' + cleanHour(ep) + ' ' + (ep.timeZoneName || 'local');
  return { dateLine: dateLine, timeLine: timeLine, topLine: dateLine + ' • ' + timeLine };
}

var riskLayer = L.geoJSON(null, {
  style: function(f) {
    var color = (f.properties && f.properties.color) || '#f97316';
    return { color: color, weight: 2, opacity: 0.95, fillColor: color, fillOpacity: 0.36 };
  },
  onEachFeature: function(f, layer) {
    var p = f.properties || {};
    var html = '<b>' + (p.category || 'Risk Area') + '</b><br>' +
      'Period: ' + (p.href_period || '') + '<br>' +
      'Run: ' + (p.href_run || '') + '<br>' +
      'Max QPF: ' + fmtIn(p.max_qpf_in) + '<br>' +
      'Min guidance: ' + fmtIn(p.min_ffg_in) + '<br>' +
      'Max QPF/guidance: ' + (p.max_qpf_ffg_ratio == null ? '' : p.max_qpf_ffg_ratio) + '<br>' +
      'Grid cells: ' + (p.cell_count == null ? '' : p.cell_count);
    layer.bindPopup(html);
  }
}).addTo(map);

var rawLayer = L.geoJSON(null, {
  style: function(f) {
    var cat = f.properties ? f.properties.category : '';
    var color = cat === 'Significant' ? '#dc2626' : cat === 'Probable' ? '#f97316' : '#facc15';
    return { color: color, weight: 0.5, opacity: 0.45, fillColor: color, fillOpacity: 0.12 };
  }
});

var ffgLayer = L.geoJSON(null, {
  style: { color: '#38bdf8', weight: 2, opacity: 0.8, fillColor: '#38bdf8', fillOpacity: 0.08 },
  onEachFeature: function(f, layer) {
    var p = f.properties || {};
    var details = '';
    if (p.ffg_bin_label) details += '<br>Bin: ' + p.ffg_bin_label;
    if (p.raw_ffg_class_code != null) details += '<br>Raw class code: ' + p.raw_ffg_class_code;
    layer.bindPopup('<b>Guidance input</b><br>6hr: ' + fmtIn(p.ffg_6hr) + details);
  }
});

var proneLayer = L.geoJSON(null, {
  style: { color: '#a78bfa', weight: 2, opacity: 0.85, fillColor: '#a78bfa', fillOpacity: 0.12 },
  onEachFeature: function(f, layer) {
    var p = f.properties || {};
    layer.bindPopup('<b>Flood-prone input</b><br>' + (p.name || '') + '<br>' + (p.susceptibility || ''));
  }
});

var layerControl = L.control.layers({ 'OpenStreetMap': osm }, { 'Risk polygons': riskLayer, 'Raw risk cells': rawLayer, '6-hr FFG': ffgLayer, 'Flood-prone areas': proneLayer }, { collapsed: true }).addTo(map);

function resolveHrefAssetUrl(catalogUrl, rel) {
  if (!rel) return null;
  if (rel.indexOf('http://') === 0 || rel.indexOf('https://') === 0) return rel;
  var base = catalogUrl.split('/').slice(0, -1).join('/') + '/';
  if (rel.indexOf('data/') === 0 && base.endsWith('/data/')) base = base.slice(0, -6) + '/';
  return new URL(rel, base).href;
}
function currentHrefOpacity() { var slider = document.getElementById('hrefOpacity'); return slider ? Number(slider.value) : 0.58; }
function updateHrefOpacityLabel() { var label = document.getElementById('hrefOpacityValue'); if (label) label.textContent = Math.round(currentHrefOpacity() * 100) + '%'; }
function syncHrefRasterVisibility() {
  if (!hrefRasterLayer) return;
  var toggle = document.getElementById('hrefRasterToggle');
  var shouldShow = !toggle || toggle.checked;
  if (shouldShow && !map.hasLayer(hrefRasterLayer)) hrefRasterLayer.addTo(map);
  if (!shouldShow && map.hasLayer(hrefRasterLayer)) map.removeLayer(hrefRasterLayer);
  hrefRasterLayer.setOpacity(currentHrefOpacity());
  if (map.hasLayer(hrefRasterLayer)) hrefRasterLayer.bringToBack();
}
function syncOptionalOverlayVisibility() {
  var ffgToggle = document.getElementById('ffgLayerToggle');
  var proneToggle = document.getElementById('proneLayerToggle');
  if (ffgToggle && ffgToggle.checked && !map.hasLayer(ffgLayer)) ffgLayer.addTo(map);
  if (ffgToggle && !ffgToggle.checked && map.hasLayer(ffgLayer)) map.removeLayer(ffgLayer);
  if (proneToggle && proneToggle.checked && !map.hasLayer(proneLayer)) proneLayer.addTo(map);
  if (proneToggle && !proneToggle.checked && map.hasLayer(proneLayer)) map.removeLayer(proneLayer);
}
function wireLayerControls() {
  var hrefToggle = document.getElementById('hrefRasterToggle');
  var ffgToggle = document.getElementById('ffgLayerToggle');
  var proneToggle = document.getElementById('proneLayerToggle');
  var slider = document.getElementById('hrefOpacity');
  if (hrefToggle) hrefToggle.addEventListener('change', syncHrefRasterVisibility);
  if (ffgToggle) ffgToggle.addEventListener('change', syncOptionalOverlayVisibility);
  if (proneToggle) proneToggle.addEventListener('change', syncOptionalOverlayVisibility);
  if (slider) slider.addEventListener('input', function(){ updateHrefOpacityLabel(); syncHrefRasterVisibility(); });
  map.on('overlayadd overlayremove', function(e) {
    if (e.layer === ffgLayer && ffgToggle) ffgToggle.checked = map.hasLayer(ffgLayer);
    if (e.layer === proneLayer && proneToggle) proneToggle.checked = map.hasLayer(proneLayer);
  });
  updateHrefOpacityLabel();
  syncOptionalOverlayVisibility();
}
function removeHrefRaster() {
  if (!hrefRasterLayer) return;
  map.removeLayer(hrefRasterLayer);
  try { layerControl.removeLayer(hrefRasterLayer); } catch(e) {}
  hrefRasterLayer = null;
}
function addHrefRasterForRisk(period, risk) {
  removeHrefRaster();
  var layer = risk && risk.metadata ? risk.metadata.href_layer : null;
  if (!layer || !layer.rasterUrl || !layer.rasterBounds) return false;
  var b = layer.rasterBounds;
  var bounds = [[b.south, b.west], [b.north, b.east]];
  var rasterUrl = resolveHrefAssetUrl(currentManifest.href_catalog_url, layer.rasterUrl);
  hrefRasterLayer = L.imageOverlay(rasterUrl, bounds, { opacity: currentHrefOpacity(), interactive: false }).addTo(map);
  layerControl.addOverlay(hrefRasterLayer, 'HREF QPF');
  syncHrefRasterVisibility();
  return true;
}

function describeSource(ffg) {
  var meta = ffg && ffg.metadata ? ffg.metadata : {};
  if (meta.official_ffg === true) return '<span class="badge good">Official FFG</span>';
  return '<span class="badge warn">Local fallback FFG</span>';
}

function renderPeriodButtons() {
  var holder = document.getElementById('periodButtons');
  var periods = periodsManifest.periods || [];
  holder.innerHTML = periods.map(function(p) {
    var lbl = periodLabel(p);
    return '<button class="period-btn" data-period="' + p.period_index + '"><b>' + lbl.dateLine + '</b><span>' + lbl.timeLine + '</span></button>';
  }).join('');
  holder.querySelectorAll('.period-btn').forEach(function(btn) {
    btn.addEventListener('click', function(){ loadPeriod(Number(btn.getAttribute('data-period'))); });
  });
}
function setActiveButton(periodIndex) {
  document.querySelectorAll('.period-btn').forEach(function(btn) {
    btn.classList.toggle('active', Number(btn.getAttribute('data-period')) === periodIndex);
  });
}
function loadPeriod(periodIndex) {
  var period = (periodsManifest.periods || []).find(function(p){ return p.period_index === periodIndex; });
  if (!period) return;
  activePeriodIndex = periodIndex;
  setActiveButton(periodIndex);
  var lbl = periodLabel(period);
  document.getElementById('topPeriodLabel').textContent = lbl.topLine;
  document.getElementById('status').textContent = 'Loading...';
  Promise.all([getJSON(period.risk_url), getJSON(period.raw_url)]).then(function(results) {
    var risk = results[0];
    var raw = results[1];
    riskLayer.clearLayers();
    rawLayer.clearLayers();
    riskLayer.addData(risk);
    rawLayer.addData(raw);
    addHrefRasterForRisk(period, risk);
    document.getElementById('status').innerHTML = (period.risk_feature_count || 0) === 0 ? '<span class="warn">No highlighted risk areas this period.</span>' : '';
  }).catch(function(err) {
    document.getElementById('status').textContent = 'Load failed: ' + err.message;
    console.error(err);
  });
}

wireLayerControls();
Promise.all([
  getJSON('data/manifest.json'),
  getJSON('data/periods_manifest.json'),
  getJSON('data/ffg.geojson').catch(function(){ return {type:'FeatureCollection', features:[]}; }),
  getJSON('data/flood_prone.geojson').catch(function(){ return {type:'FeatureCollection', features:[]}; })
]).then(function(results) {
  currentManifest = results[0];
  periodsManifest = results[1];
  ffgData = results[2];
  proneData = results[3];
  document.getElementById('sourceMode').innerHTML = describeSource(ffgData);
  ffgLayer.addData(ffgData);
  proneLayer.addData(proneData);
  syncOptionalOverlayVisibility();
  renderPeriodButtons();
  loadPeriod(1);
}).catch(function(err) {
  document.getElementById('status').textContent = 'Load failed: ' + err.message;
  console.error(err);
});
</script>
</body>
</html>
