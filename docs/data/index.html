<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>LIX Flood Risk Fusion</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body { margin: 0; height: 100%; font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0; }
    .app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
    header { padding: 14px 18px; background: #111827; border-bottom: 1px solid #334155; }
    h1 { margin: 0; font-size: 1.2rem; }
    .subtitle { color: #94a3b8; font-size: .9rem; margin-top: 3px; }
    #map { height: 100%; width: 100%; }
    .panel {
      position: absolute; z-index: 1000; top: 90px; right: 14px;
      width: 310px; background: rgba(15,23,42,.94); color: #e2e8f0;
      border: 1px solid #475569; border-radius: 12px; padding: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,.35); font-size: 13px;
    }
    .panel h2 { font-size: 14px; margin: 0 0 8px 0; }
    .row { display:flex; align-items:center; gap:8px; margin: 6px 0; }
    .swatch { width: 16px; height: 16px; border-radius: 4px; display:inline-block; border:1px solid rgba(255,255,255,.45); }
    .small { color: #94a3b8; font-size: 12px; line-height: 1.35; }
    .leaflet-popup-content { font-size: 13px; }
    a { color: #93c5fd; }
  </style>
</head>
<body>
<div class="app">
  <header>
    <h1>LIX Flood Risk Fusion</h1>
    <div class="subtitle">HREF 6-hr ensemble max QPF × FFG × local flood-prone areas</div>
  </header>
  <div id="map"></div>
</div>

<div class="panel">
  <h2>Risk categories</h2>
  <div class="row"><span class="swatch" style="background:#dc2626"></span> Significant: QPF ≥ 150% of FFG</div>
  <div class="row"><span class="swatch" style="background:#f97316"></span> Probable: QPF ≥ FFG</div>
  <div class="row"><span class="swatch" style="background:#facc15"></span> Possible: QPF ≥ 75% of FFG</div>
  <hr style="border-color:#334155">
  <div class="small" id="status">Loading...</div>
</div>

<script>
const map = L.map("map", {preferCanvas: true}).setView([30.15, -90.35], 8);

const base = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 18,
  attribution: "&copy; OpenStreetMap contributors"
}).addTo(map);

const riskLayer = L.geoJSON(null, {
  style: f => ({
    color: f.properties.color || "#f97316",
    weight: 2,
    opacity: 0.95,
    fillColor: f.properties.color || "#f97316",
    fillOpacity: 0.34
  }),
  onEachFeature: (f, layer) => {
    const p = f.properties || {};
    layer.bindPopup(`
      <b>${p.category || "Risk Area"}</b><br>
      Period: ${p.href_period || ""}<br>
      Run: ${p.href_run || ""}<br>
      Max QPF: ${p.max_qpf_in ?? ""}"<br>
      Min FFG: ${p.min_ffg_in ?? ""}"<br>
      Max QPF/FFG: ${p.max_qpf_ffg_ratio ?? ""}<br>
      Grid cells: ${p.cell_count ?? ""}
    `);
  }
}).addTo(map);

const rawLayer = L.geoJSON(null, {
  style: f => ({
    color: f.properties.category === "Significant" ? "#dc2626" : f.properties.category === "Probable" ? "#f97316" : "#facc15",
    weight: 0.6,
    opacity: 0.5,
    fillOpacity: 0.12
  })
});

const overlays = {
  "Risk polygons": riskLayer,
  "Raw selected grid cells": rawLayer
};

L.control.layers({"OpenStreetMap": base}, overlays, {collapsed: false}).addTo(map);

async function getJSON(url) {
  const r = await fetch(url, {cache: "no-store"});
  if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`);
  return await r.json();
}

async function main() {
  const status = document.getElementById("status");
  try {
    const manifest = await getJSON("data/manifest.json");
    const risk = await getJSON("data/flash_flood_risk.geojson");
    riskLayer.addData(risk);

    try {
      const raw = await getJSON("data/flash_flood_risk_raw_cells.geojson");
      rawLayer.addData(raw);
    } catch (e) {
      console.warn("Raw cell layer unavailable", e);
    }

    if (risk.features && risk.features.length) {
      map.fitBounds(riskLayer.getBounds(), {padding: [25, 25]});
    }

    status.innerHTML = `
      Generated: ${manifest.generated_utc || ""}<br>
      HREF: ${manifest.href_period || ""}<br>
      Risk polygons: ${manifest.risk_feature_count ?? 0}<br>
      Raw cells: ${manifest.raw_cell_count ?? 0}
    `;
  } catch (e) {
    console.error(e);
    status.textContent = `Load failed: ${e.message}`;
  }
}

main();
</script>
</body>
</html>
