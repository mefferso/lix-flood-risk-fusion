name: Build flood risk fusion map

on:
  workflow_dispatch:
  schedule:
    # Runs every 3 hours. Adjust once the HREF/FFG timing is dialed in.
    - cron: "35 */3 * * *"
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: flood-risk-fusion
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create sample inputs if missing
        run: python scripts/make_sample_inputs.py --only-if-missing

      - name: Try fetching real gridded FFG from ArcGIS
        id: fetch_ffg_arcgis
        continue-on-error: true
        run: |
          mkdir -p docs/data
          python scripts/fetch_ffg_arcgis.py \
            --out data/ffg/ffg.geojson \
            --debug-json docs/data/ffg_arcgis_debug.json \
            --bbox -92.75,28.75,-88.25,31.25 \
            --duration 6

      - name: Try fetching text FFG fallback
        id: fetch_ffg_text
        if: steps.fetch_ffg_arcgis.outcome == 'failure'
        continue-on-error: true
        run: |
          mkdir -p docs/data
          python scripts/fetch_ffg_orn.py \
            --out data/ffg/ffg.geojson \
            --raw-out docs/data/latest_ffg_product.txt \
            --debug-json docs/data/ffg_parse_debug.json \
            --states LA,MS

      - name: Write FFG fallback debug output
        if: steps.fetch_ffg_arcgis.outcome == 'failure' && steps.fetch_ffg_text.outcome == 'failure'
        run: python scripts/write_ffg_fallback_debug.py

      - name: Fuse HREF QPF + FFG + flood-prone areas
        run: |
          python scripts/fuse_flash_flood_risk.py \
            --href-catalog-url https://mefferso.github.io/href-qpf-viewer/data/catalog.json \
            --ffg data/ffg/ffg.geojson \
            --flood-prone data/flood_prone/flood_prone.geojson \
            --duration 6 \
            --out docs/data/flash_flood_risk.geojson \
            --raw-out docs/data/flash_flood_risk_raw_cells.geojson \
            --manifest-out docs/data/manifest.json

      - name: Publish debug input layers
        run: |
          mkdir -p docs/data
          cp data/ffg/ffg.geojson docs/data/ffg.geojson
          cp data/flood_prone/flood_prone.geojson docs/data/flood_prone.geojson

      - name: Commit generated data
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/*.geojson docs/data/*.json docs/data/*.txt data/ffg/ffg.geojson || true
          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
          else
            git commit -m "Update flood risk fusion data [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
